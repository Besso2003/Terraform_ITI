- name: Configure Jenkins JNLP Agent Node
  hosts: app
  become: yes

  tasks:

    - name: Update system packages
      yum:
        name: "*"
        state: latest

    - name: Install Java 17 (required for Jenkins agent)
      yum:
        name: java-17-amazon-corretto
        state: present

    - name: Install wget (useful for downloading agent.jar)
      yum:
        name: wget
        state: present

    - name: Create Jenkins working directory
      file:
        path: /home/ec2-user/jenkins
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'