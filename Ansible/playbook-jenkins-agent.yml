- name: Configure Jenkins SSH Agent Node
  hosts: app
  become: yes

  vars:
    agent_dir: /home/ec2-user/jenkins

  tasks:
    - name: Update system packages
      yum:
        name: "*"
        state: latest

    - name: Install Java 17
      yum:
        name: java-17-amazon-corretto
        state: present

    - name: Create Jenkins working directory
      file:
        path: "{{ agent_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Ensure ec2-user .ssh directory exists
      file:
        path: /home/ec2-user/.ssh
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"