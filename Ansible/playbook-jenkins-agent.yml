- name: Configure Jenkins JNLP Agent Node
  hosts: app
  become: yes

  vars:
    agent_dir: /home/ec2-user/jenkins

  tasks:

    - name: Update system packages
      yum:
        name: "*"
        state: latest

    - name: Install Java 17
      yum:
        name: java-17-amazon-corretto
        state: present

    - name: Install wget
      yum:
        name: wget
        state: present

    - name: Create Jenkins working directory
      file:
        path: "{{ agent_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Download Jenkins agent jar
      get_url:
        url: "{{ jenkins_url }}/jnlpJars/agent.jar"
        dest: "{{ agent_dir }}/agent.jar"
        mode: "0755"

    - name: Create systemd service for Jenkins agent
      copy:
        dest: /etc/systemd/system/jenkins-agent.service
        content: |
          [Unit]
          Description=Jenkins Agent
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory={{ agent_dir }}
          ExecStart=/usr/bin/java -jar {{ agent_dir }}/agent.jar \
            -url {{ jenkins_url }} \
            -secret {{ jenkins_secret }} \
            -name private-agent \
            -webSocket \
            -workDir {{ agent_dir }}

          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable Jenkins agent service
      systemd:
        name: jenkins-agent
        enabled: yes

    - name: Start Jenkins agent service
      systemd:
        name: jenkins-agent
        state: started